name: Maven CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify --file pom.xml
      - name: Upload NARs
        uses: actions/upload-artifact@v4
        with:
          name: nars
          path: |
            nifi-datasynthesizer-nar/target/*.nar
            nifi-datasynthesizer-service-nar/target/*.nar
            nifi-datasynthesizer-service-api-nar/target/*.nar
          if-no-files-found: error
